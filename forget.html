<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Susu Horizon</title>

    <link rel="stylesheet" href="styles.css">

</head>


<body class="forgot-page">


    <div class="forgot-box">


        <h1>Forgot Password?</h1>


        <p>

            Enter your email and we will help you
            reset your password.

        </p>


        <form id="forgotForm">


            <input
                type="email"
                id="forgotEmail"
                placeholder="Enter your email"
                required
            >


            <button type="submit">

                Reset Password

            </button>


        </form>


        <p class="back-login">

            Remember your password?

            <a href="index.html">

                Back to Login

            </a>

        </p>


    </div>


    <script src="script.js"></script>


</body>

</html>
