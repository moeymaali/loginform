<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register | Susu Horizon</title>

    <link rel="stylesheet" href="styles.css">

</head>


<body class="register-page">


    <div class="register-container">


        

        <div class="image-side">


            <div class="register-logo">

                <img
                    src="fotos/logo.png"
                    alt="Susu Horizon Logo"
                >

            </div>


            <div class="image-text">

                <h1>Create Your Account Now!</h1>

                <p>
                    Create your account and start discovering
                    beautiful destinations with Susu Horizon Travel.
                </p>

            </div>


        </div>



        

        <div class="form-side">


            <form
                class="register-form"
                id="registerForm"
                autocomplete="off"
            >


                <h2>Register Now!</h2>


                <p class="subtitle">

                    Register now to start your journey!

                </p>



                

                <div class="name-row">


                    <div class="input-group">

                        <label>First Name</label>

                        <input
                            type="text"
                            id="firstName"
                            placeholder="First Name"
                            autocomplete="off"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label>Last Name</label>

                        <input
                            type="text"
                            id="lastName"
                            placeholder="Last Name"
                            autocomplete="off"
                            required
                        >

                    </div>


                </div>



                

                <div class="input-group">

                    <label>Email</label>

                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="example@email.com"
                        autocomplete="off"
                        required
                    >

                </div>



                

                <div class="input-group">

                    <label>Password</label>


                    <div class="password-box">


                        <input
                            type="password"
                            id="registerPassword"
                            placeholder="Create your password"
                            autocomplete="new-password"
                            required
                        >


                        <button
                            type="button"
                            class="show-password"
                            id="showPassword"
                        >

                            👁

                        </button>


                    </div>

                </div>



               

                <div class="terms">

                    <input
                        type="checkbox"
                        id="terms"
                    >


                    <label for="terms">

                        I agree to the Terms and Privacy Policy

                    </label>

                </div>



                

                <button
                    type="submit"
                    class="signup-button"
                >

                    Sign Up →

                </button>



                

                <p class="signin">

                    Already have an account?

                    <a href="index.html">

                        Sign In

                    </a>

                </p>


            </form>


        </div>


    </div>


    <script src="script.js"></script>


</body>

</html>
